name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Windows installer and portable app
        run: npm run dist:win

      - name: Publish a release for this main build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-main.${{ github.run_number }}.${{ github.sha }}
          name: ClimaNova Windows build ${{ github.run_number }}
          make_latest: true
          files: release/*.exe
